<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">XeroWA AI logo mark</title>
  <desc id="description">An X7 monogram engineered inside a rounded chat bubble.</desc>
  <defs>
